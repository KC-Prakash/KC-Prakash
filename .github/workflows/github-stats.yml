name: 📊 Update GitHub Profile Statistics

on:
schedule:
- cron: "0 0 * * *"

workflow_dispatch:

push:
paths:
- ".github/workflows/github-stats.yml"
- "scripts/**"

permissions:
contents: write

jobs:
generate:
name: Generate Profile Statistics
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Create generator directory
    run: mkdir -p scripts assets/github

  - name: Create package.json
    run: |
      cat > scripts/package.json <<'EOF'
      {
        "name": "github-profile-stats",
        "private": true,
        "type": "module",
        "dependencies": {
          "@octokit/rest": "^21.1.1"
        }
      }
      EOF

  - name: Install dependencies
    working-directory: scripts
    run: npm install

  - name: Create statistics generator
    working-directory: scripts
    run: |
      cat > generate.js <<'EOF'
      import { Octokit } from "@octokit/rest";
      import fs from "fs";

      const USERNAME = "KC-Prakash";
      const OUTPUT = "../assets/github";

      const octokit = new Octokit({
        auth: process.env.GITHUB_TOKEN
      });

      const esc = (value) =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&apos;");

      const svg = (content, width = 900, height = 420) => `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="${width}"
           height="${height}"
           viewBox="0 0 ${width} ${height}">
        <rect width="100%" height="100%" rx="18"
              fill="#0d1117"
              stroke="#30363d"/>
        ${content}
      </svg>`;

      const text = (x, y, value, size = 16, weight = 400) => `
        <text x="${x}" y="${y}"
              fill="#e6edf3"
              font-family="Arial, Helvetica, sans-serif"
              font-size="${size}px"
              font-weight="${weight}">
          ${esc(value)}
        </text>
      `;

      const line = (x1, y1, x2, y2) => `
        <line x1="${x1}" y1="${y1}"
              x2="${x2}" y2="${y2}"
              stroke="#30363d"
              stroke-width="1"/>
      `;

      async function getProfile() {
        const { data } =
          await octokit.rest.users.getByUsername({
            username: USERNAME
          });

        return data;
      }

      async function getRepositories() {
        const repositories = [];

        for await (const response of octokit.paginate.iterator(
          octokit.rest.repos.listForUser,
          {
            username: USERNAME,
            per_page: 100,
            type: "owner",
            sort: "updated"
          }
        )) {
          repositories.push(...response.data);
        }

        return repositories;
      }

      async function getEvents() {
        const events = [];

        for await (const response of octokit.paginate.iterator(
          octokit.rest.activity.listPublicEventsForUser,
          {
            username: USERNAME,
            per_page: 100
          }
        )) {
          events.push(...response.data);
        }

        return events;
      }

      function generateStats(profile, repositories) {
        const stars = repositories.reduce(
          (sum, repo) => sum + repo.stargazers_count,
          0
        );

        const forks = repositories.reduce(
          (sum, repo) => sum + repo.forks_count,
          0
        );

        const languages = new Set(
          repositories
            .map(repo => repo.language)
            .filter(Boolean)
        );

        const content = `
          ${text(40, 55, "📊 GitHub Statistics", 25, 700)}

          ${line(40, 75, 860, 75)}

          ${text(60, 125, "Repositories", 15)}
          ${text(60, 160, repositories.length, 30, 700)}

          ${text(280, 125, "Followers", 15)}
          ${text(280, 160, profile.followers, 30, 700)}

          ${text(500, 125, "Following", 15)}
          ${text(500, 160, profile.following, 30, 700)}

          ${text(700, 125, "Public Gists", 15)}
          ${text(700, 160, profile.public_gists, 30, 700)}

          ${line(40, 205, 860, 205)}

          ${text(60, 250, "Total Stars", 15)}
          ${text(60, 285, stars, 30, 700)}

          ${text(280, 250, "Total Forks", 15)}
          ${text(280, 285, forks, 30, 700)}

          ${text(500, 250, "Languages", 15)}
          ${text(500, 285, languages.size, 30, 700)}

          ${text(700, 250, "Profile", 15)}
          ${text(700, 285, "KC-Prakash", 22, 700)}

          ${line(40, 330, 860, 330)}

          ${text(
            60,
            370,
            "Full-Stack Web Development • Cybersecurity • Systems",
            15
          )}
        `;

        return svg(content, 900, 420);
      }

      function generateLanguages(repositories) {
        const counts = {};

        repositories.forEach(repo => {
          if (!repo.language) return;

          counts[repo.language] =
            (counts[repo.language] || 0) + 1;
        });

        const sorted = Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 8);

        const total = sorted.reduce(
          (sum, [, count]) => sum + count,
          0
        );

        let y = 110;

        let content = `
          ${text(40, 55, "💻 Top Languages", 25, 700)}
          ${line(40, 75, 860, 75)}
        `;

        sorted.forEach(([language, count]) => {
          const percentage =
            total ? Math.round((count / total) * 100) : 0;

          content += `
            ${text(60, y, language, 15, 600)}

            <rect
              x="230"
              y="${y - 13}"
              width="430"
              height="12"
              rx="6"
              fill="#21262d"/>

            <rect
              x="230"
              y="${y - 13}"
              width="${Math.max(
                12,
                430 * percentage / 100
              )}"
              height="12"
              rx="6"
              fill="#58a6ff"/>

            ${text(
              690,
              y,
              `${percentage}%`,
              14,
              600
            )}
          `;

          y += 38;
        });

        return svg(content, 900, 430);
      }

      function generateStreak(events) {
        const today = new Date();

        const days = new Set();

        events.forEach(event => {
          const date = new Date(event.created_at)
            .toISOString()
            .slice(0, 10);

          days.add(date);
        });

        let streak = 0;

        for (let i = 0; i < 365; i++) {
          const date = new Date(today);
          date.setDate(date.getDate() - i);

          const key = date
            .toISOString()
            .slice(0, 10);

          if (days.has(key)) {
            streak++;
          } else if (i > 0) {
            break;
          }
        }

        const content = `
          ${text(40, 55, "🔥 GitHub Activity Streak", 25, 700)}

          ${line(40, 75, 860, 75)}

          ${text(80, 150, "Current Activity", 16)}

          ${text(
            80,
            205,
            `${streak} day${streak === 1 ? "" : "s"}`,
            42,
            700
          )}

          ${text(
            80,
            250,
            "Based on recent public GitHub activity",
            14
          )}

          ${text(
            520,
            170,
            "KC-Prakash",
            26,
            700
          )}

          ${text(
            520,
            205,
            "Keep building. Keep learning.",
            15
          )}
        `;

        return svg(content, 900, 300);
      }

      function generateActivity(events) {
        const recent = events
          .slice(0, 10)
          .map(event => {
            const date = new Date(event.created_at)
              .toISOString()
              .slice(0, 10);

            return {
              type: event.type,
              repo: event.repo.name,
              date
            };
          });

        let y = 105;

        let content = `
          ${text(40, 55, "📈 Recent GitHub Activity", 25, 700)}
          ${line(40, 75, 860, 75)}
        `;

        recent.forEach(item => {
          content += `
            ${text(60, y, item.type, 15, 600)}
            ${text(300, y, item.repo, 15)}
            ${text(700, y, item.date, 14)}
          `;

          y += 30;
        });

        return svg(content, 900, 430);
      }

      async function main() {
        fs.mkdirSync(OUTPUT, {
          recursive: true
        });

        const [profile, repositories, events] =
          await Promise.all([
            getProfile(),
            getRepositories(),
            getEvents()
          ]);

        fs.writeFileSync(
          `${OUTPUT}/stats.svg`,
          generateStats(profile, repositories)
        );

        fs.writeFileSync(
          `${OUTPUT}/languages.svg`,
          generateLanguages(repositories)
        );

        fs.writeFileSync(
          `${OUTPUT}/streak.svg`,
          generateStreak(events)
        );

        fs.writeFileSync(
          `${OUTPUT}/activity.svg`,
          generateActivity(events)
        );

        console.log("GitHub profile statistics generated.");
      }

      main().catch(error => {
        console.error(error);
        process.exit(1);
      });
      EOF

  - name: Generate SVG cards
    working-directory: scripts
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: node generate.js

  - name: Commit generated statistics
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add assets/github/*.svg

      if git diff --cached --quiet; then
        echo "No statistics changes."
      else
        git commit -m "chore: update GitHub profile statistics"
        git push
      fi
```

